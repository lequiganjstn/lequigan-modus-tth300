<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · Modus</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="shell" id="shell"></div>

<script src="js/sidebar.js"></script>
<script src="js/data.js"></script>
<script>
  document.getElementById("shell").innerHTML = `
    ${renderSidebar("dashboard")}
    <main class="main">
      <div class="topbar">
        <div>
          <div class="page-title">Dashboard</div>
          <div class="page-subtitle">Overview of your current stock</div>
        </div>
        <div class="topbar-actions">
          <a href="item-form.html" class="btn btn-primary">+ Add item</a>
        </div>
      </div>

      <div class="stat-grid" id="stat-grid"></div>

      <div class="topbar" style="margin-bottom:12px;">
        <div class="page-title" style="font-size:16px;">Low &amp; out of stock</div>
        <a href="inventory.html" class="btn btn-secondary btn-sm">View all items</a>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>SKU</th>
              <th>Category</th>
              <th>Quantity</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="attention-rows"></tbody>
        </table>
      </div>
    </main>
  `;

  const { items, categories } = loadData();
  saveData(items, categories);

  const totalItems = items.length;
  const totalUnits = items.reduce((sum, i) => sum + i.qty, 0);
  const lowStock = items.filter((i) => stockStatus(i) === "low");
  const outStock = items.filter((i) => stockStatus(i) === "out");
  const totalValue = items.reduce((sum, i) => sum + i.qty * i.unitCost, 0);

  document.getElementById("stat-grid").innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Total items</div>
      <div class="stat-value">${totalItems}</div>
      <div class="stat-delta">${categories.length} categories</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Units in stock</div>
      <div class="stat-value">${totalUnits.toLocaleString()}</div>
      <div class="stat-delta">Across all locations</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Low stock</div>
      <div class="stat-value warn">${lowStock.length}</div>
      <div class="stat-delta">At or below reorder level</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Out of stock</div>
      <div class="stat-value danger">${outStock.length}</div>
      <div class="stat-delta">Needs restock now</div>
    </div>
  `;

  const attention = items
    .filter((i) => stockStatus(i) !== "ok")
    .sort((a, b) => a.qty - b.qty)
    .slice(0, 8);

  const rows = document.getElementById("attention-rows");

  if (attention.length === 0) {
    rows.innerHTML = `<tr><td colspan="5"><div class="empty-state"><h3>Everything's stocked</h3><p>No items are low or out of stock right now.</p></div></td></tr>`;
  } else {
    rows.innerHTML = attention
      .map((i) => {
        const cat = categoryById(categories, i.categoryId);
        const status = stockStatus(i);
        const badge =
          status === "out"
            ? `<span class="badge badge-out"><span class="badge-dot"></span>Out of stock</span>`
            : `<span class="badge badge-low"><span class="badge-dot"></span>Low stock</span>`;
        return `
          <tr>
            <td class="cell-primary">${i.name}</td>
            <td class="sku-tag">${i.sku}</td>
            <td>${cat ? `<span class="pill">${cat.name}</span>` : "—"}</td>
            <td>${i.qty}</td>
            <td>${badge}</td>
          </tr>`;
      })
      .join("");
  }
</script>
</body>
</html>
